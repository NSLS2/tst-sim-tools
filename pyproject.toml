[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tst-sim-tools"
authors = [
  { name = "Brookhaven National Laboratory", email = "thopkins1@bnl.gov" },
]
description = "Tools for NSLS-II TST beamline's simulated endstation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11,<3.14"
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "bluesky>=1.15.1",
  "tiled[client]",
  "bluesky-tiled-plugins",
  "ophyd-async[ca, pva, sim]",
  "nslsii",
  "blop[cpu,ax,queueserver]",
  "scipy>=1.14",
  "xrt==2.0.0b1",
]

[dependency-groups]
dev = [
  "h5py",
  "import-linter",
  "mdformat",
  "mdformat-frontmatter",
  "nbstripout",
  "numpydoc",
  "pipdeptree",
  "pre-commit",
  "pre-commit-hooks",
  "pyright",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-mock",
  "pytest-socket>=0.8.1",
  "pytest-timeout",
  "ruff",
  "tiled[client,server]",
]
docs = [
  "pydata-sphinx-theme>=0.12",
  "myst-parser",
  "sphinx-autobuild",
  "sphinx-autodoc2",
  "sphinxcontrib-mermaid",
  "sphinx-copybutton",
  "sphinx-design",
]

[project.urls]
Homepage = "https://github.com/NSLS2/tst-sim-tools"
Issues = "https://github.com/NSLS2/tst-sim-tools/issues"
Discussions = "https://github.com/NSLS2/tst-sim-tools/discussions"
Changelog = "https://github.com/NSLS2/tst-sim-tools/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
artifacts = ["src/tst_sim_tools/_version.py"]

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/tst_sim_tools/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tst_sim_tools"]

[tool.pyright]
typeCheckingMode = "standard"
# The standalone caproto IOC runs in the ioc environment and predates type checking
ignore = ["iocs"]

[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv --strict-config --strict-markers --doctest-modules
    --doctest-glob="*.rst" --doctest-glob="*.md"
    --ignore=docs/examples --ignore=docs/_scripts --ignore=src/tst_sim_tools/profiles
    --ignore=src/tst_sim_tools/startup
    --disable-socket --allow-unix-socket
    """
markers = ["integration: local round-trip tests excluded from per-push CI"]
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = [
    "error",
    "ignore:tagMap is deprecated:DeprecationWarning:ldap3",
    "ignore:typeMap is deprecated:DeprecationWarning:ldap3",
    # Raised while importing blop's Ax/BoTorch stack
    'ignore:`torch\.jit\.script` is deprecated:FutureWarning',
    'ignore:ax\.service\.\S+ has been moved to:DeprecationWarning',
]
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = "docs src tests"
log_format = "%(asctime)s,%(msecs)03d %(levelname)s (%(threadName)s) %(message)s"
log_date_format = "%H:%M:%S"

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
patch = ["subprocess"]
# branch = true

[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 125
lint.select = [
  "B",       # flake8-bugbear
  "C4",      # flake8-comprehensions
  "D",       # pydocstyle
  "E",       # pycodestyle errors
  "F",       # Pyflakes
  "I",       # isort
  "LOG015",  # root logger calls
  "N",       # pep8-naming
  "PLC2701", # private imports
  "S101",    # assert
  "SLF",     # private member access
  "UP",      # pyupgrade
  "W",       # pycodestyle warnings
]
lint.ignore = [
  "B901", # Return in a generator is needed for plans
  "D102", # Inherited abstract methods do not need duplicate docstrings.
  "D107", # Class docstrings document initialization.
]
lint.preview = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["tst_sim_tools"]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
"tests/**/*" = ["D", "S101", "SLF001"]
# Profiles import names for use in the interactive session
"src/tst_sim_tools/profiles/**/*" = ["F401"]
# Startup modules build the interactive and Queue Server namespaces
"src/tst_sim_tools/startup/collection.py" = ["F401", "F403", "E402"]
"src/tst_sim_tools/startup/devices.py" = ["F401"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
# We often shorten "Annotated" to "A" for brevity
# in ophyd-async declarative style devices
"typing.Annotated" = "A"

[tool.ruff.lint.pep8-naming]
# The fixture RE is commonly used in tests
extend-ignore-names = ["RE"]

[tool.importlinter]
root_package = "tst_sim_tools"
