[workspace]
channels = ["conda-forge"]
name = "tst-sim-tools"
# glibc 2.28 (RHEL 8) lets uv pick manylinux_2_28 wheels, which PySide6 requires
platforms = [{ name = "linux-64-glibc228", platform = "linux-64", glibc = "2.28" }]
version = "0.1.0"
requires-pixi = ">=0.82.1"

# conda-forge only provides the Python interpreter, system certificates, and PySide6.
# Every other Python package is resolved from PyPI and installed by uv via [pypi-dependencies].

# Skip packages published in the last 7 days to limit exposure to compromised releases
[workspace.exclude-newer]
cutoff = "7days"

[workspace.exclude-newer.exemptions]
# Security floor in [dependencies] may need fixes published within the cooldown
ca-certificates = "*"

# PyPI packages fall back to the conda cutoff above; PyPI exemptions only support "*"
[workspace.pypi-exclude-newer.exemptions]
# Security floors may need fixes published within the cooldown
certifi = "*"
pip = "*"
# Packages managed by us or direct collaborators
bluesky = "*"
bluesky-tiled-plugins = "*"
event-model = "*"
nslsii = "*"
ophyd = "*"
ophyd-async = "*"
redis-json-dict = "*"
tiled = "*"

[dependencies]
ca-certificates = ">=2026.10.23,<2027"
python = ">=3.11,<3.14"

[pypi-dependencies]
tst-sim-tools = { path = ".", editable = true }
bluesky = ">=1.16.0,<2"
bluesky-tiled-plugins = ">=2.0.14,<3"
certifi = ">=2026.10.23,<2027"
ipython = ">=9.18.1,<10"
nslsii = ">=0.12.0,<0.13"
ophyd-async = ">=0.21.4,<0.22"
redis-json-dict = ">=0.2.2,<0.3"
tiled = { version = ">=0.2.21,<0.3", extras = ["client"] }

# Runtime dependencies of the startup modules in src/tst_sim_tools/startup
# PyPI packages only pull optional stacks through extras; conda-forge's tiled/databroker bundled them all
[feature.profile.pypi-dependencies]
# Publisher in startup/collection.py needs pyzmq
bluesky = { version = ">=1.16.0,<2", extras = ["zmq"] }
bluesky-queueserver = "*"
databroker = { version = "==2.0.0", extras = ["all"] }
# TILED=0 runs tiled.client.simple(), which needs the server stack and format readers
tiled = { version = ">=0.2.21,<0.3", extras = ["all"] }
epicscorelibs = ">=7.0.7.99.1.1,<8"
# Replaces conda-forge's blosc-hdf5-plugin/hdf5-external-filter-plugins; register filters with `import hdf5plugin`
hdf5plugin = "*"
matplotlib = ">=3.9.3,<4"
networkx = ">=3.4.2"
numpy = "*"
ophyd = ">=1.11.0"
pyepics = "*"
semver = ">=3.0.4,<4"

# TILED selects the Tiled server: 0 local (/tmp/tst_testing), 1 tiled-staging, 2 tiled
[feature.profile.tasks]
start-local = "TILED=0 ipython -i -m tst_sim_tools.startup.collection"
start-staging = "TILED=1 ipython -i -m tst_sim_tools.startup.collection"
start = "TILED=2 ipython -i -m tst_sim_tools.startup.collection"

# PyPI PySide6 >=6.10 wheels need glibc 2.34; conda-forge's build runs on RHEL 8 (glibc 2.28)
[feature.qs.dependencies]
pyside6 = ">=6.11.1,<7"

[feature.qs.pypi-dependencies]
bluesky-httpserver = "*"
bluesky-queueserver = "*"
bluesky-queueserver-api = "*"
bluesky-widgets = ">=0.0.18,<0.0.19"
pyqt5 = ">=5.15.11,<6"
qtpy = ">=2.4.3,<3"

[feature.qs.tasks]
qs-server-local = """
start-re-manager \
--redis-addr localhost:6379 \
--zmq-control-addr tcp://127.0.0.1:60615 \
--zmq-info-addr tcp://127.0.0.1:60625 \
--zmq-publish-console ON \
--startup-script src/tst_sim_tools/startup/collection.py \
--user-group-permissions /tmp/bsqs \
--existing-plans-devices /tmp/bsqs
--device-max-depth 0
"""
http-server-local = """
QSERVER_ZMQ_CONTROL_ADDRESS=tcp://localhost:60615 \
QSERVER_ZMQ_INFO_ADDRESS=tcp://localhost:60625 \
QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY=secret \
uvicorn --host localhost --port 60611 bluesky_httpserver.server:app
"""

# PyPI PySide6 >=6.10 wheels need glibc 2.34; conda-forge's build runs on RHEL 8 (glibc 2.28)
[feature.terminal.dependencies]
pyside6 = ">=6.11.3,<7"

[feature.terminal.pypi-dependencies]
matplotlib = ">=3.11.2,<4"
nexpy = ">=2.1.0,<3"
numpy = ">2"
qtpy = ">=2.4.3,<3"

# Simulated XRT beamline IOC (iocs/xrt_xml_ioc.py)
[feature.ioc.dependencies]
ca-certificates = ">=2026.10.23,<2027"
python = ">=3.11,<3.14"

[feature.ioc.pypi-dependencies]
caproto = "*"
h5py = "*"
numpy = "*"
xrt = ">=2.0.0b1"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.dev.pypi-dependencies]
copier = ">=9.19.1,<10"
h5py = "*"
hatch = ">=1.18.2,<2"
# 2.16 fails when no contracts are configured, and [tool.importlinter] has none yet
import-linter = ">=2.15,<2.16"
inflection = ">=0.5.1,<0.6"
mdformat = ">=1.0.0,<2"
mdformat-frontmatter = ">=2.1.2,<3"
nbstripout = ">=0.9.1,<0.10"
numpydoc = "*"
# Used by publish-pypi.yml to smoke-install the built wheel
pip = ">=26.2.2,<27"
pipdeptree = "*"
pre-commit = ">=4.7.0,<5"
pre-commit-hooks = ">=6.0.0,<7"
# The nodejs extra ships Node as a wheel instead of downloading it at runtime
pyright = { version = ">=1.1.414,<2", extras = ["nodejs"] }
pytest = ">=9.2.0,<10"
pytest-asyncio = ">=1.4.1.post1,<2"
pytest-cov = ">=7.1.0,<8"
pytest-mock = ">=3.17.0,<4"
pytest-socket = "*"
pytest-timeout = ">=2.4.0,<3"
ruff = ">=0.17.3,<0.18"
tiled = { version = ">=0.2.21,<0.3", extras = ["client", "server"] }

[feature.dev.tasks]
# Integration tests are excluded from per-push CI; they run daily via test-integration
tests = "pytest -m 'not integration' --cov=src/tst_sim_tools --cov-report=term"
test-integration = "pytest -m integration tests/integration"
lint = "pre-commit run --all-files"
update-template = "copier update --trust ."

[environments]
# Base environments
default = { solve-group = "default" }
dev = { features = ["profile", "terminal", "dev"], solve-group = "default" }

# Profile environments (Python 3.12 matches the beamline deployment)
terminal = { features = ["profile", "terminal", "py312"], solve-group = "profile" }

# Python version specific environments for CI
py311 = { features = ["profile", "terminal", "dev", "py311"], solve-group = "py311" }
py312 = { features = ["profile", "terminal", "dev", "py312"], solve-group = "py312" }
py313 = { features = ["profile", "terminal", "dev", "py313"], solve-group = "py313" }

# Queueserver environment
qs = { features = ["profile", "qs", "py312"], solve-group = "qs" }

# Simulated XRT IOC environment, independent of the package
ioc = { features = ["ioc"], solve-group = "ioc", no-default-feature = true }
